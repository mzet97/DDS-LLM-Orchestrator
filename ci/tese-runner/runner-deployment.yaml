# Runner dedicado à tese (DRAFT — NÃO APLICAR sem aprovação + digest).
#
# Diferenças para o runner existente: label exclusiva `tese-rust:host`,
# capacidade 1, imagem própria com toolchain, CA pública montada somente
# leitura, sem hostPath/sem privileged/sem Docker socket. Token via Secret
# `tese-runner-secret` (a criar SOMENTE na ativação aprovada).
# Diff a apresentar: este arquivo inteiro (novo) + digest da imagem.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tese-runner
  namespace: ci-runners
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tese-runner
  namespace: ci-runners
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tese-runner
  template:
    metadata:
      labels:
        app: tese-runner
    spec:
      serviceAccountName: tese-runner
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1001
        runAsNonRoot: true
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: runner
          # Build bootstrap verificado no .51 (só local, SEM push):
          # tese-runner:0.2.0 =
          # sha256:33c1468bec5a8c5c6e0094ebb29ee7fff3ca6dc759c6d2c90416518a8149d5d1
          # (entrypoint registro+daemon, rustfmt/clippy, libc6-dev; smoke
          # fmt+clippy+test+build como uid 1001 OK; entrypoint: registra sem
          # .runner, pula com .runner existente)
          # Na ativação aprovada: push ao Harbor e fixar aqui
          # harbor.home.arpa/tese/tese-runner@sha256:<digest-do-push>.
          # (projeto `tese` ainda não existe; robot `tese-ci` bloqueado na
          # credencial admin do Harbor — senha documentada falha com 401.)
          image: tese-runner:0.2.0
          imagePullPolicy: IfNotPresent
          env:
            - name: GITEA_INSTANCE_URL
              value: http://gitea-http.gitea.svc.cluster.local:3000
            - name: GITEA_RUNNER_REGISTRATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: tese-runner-secret
                  key: token
            - name: GITEA_RUNNER_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: GITEA_RUNNER_LABELS
              value: "tese-rust:host"
            - name: CURL_CA_BUNDLE
              value: /etc/dds-orchestrator/pki/local-root-ca.crt
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /config.yaml
              subPath: config.yaml
            - name: ca-publica
              mountPath: /etc/dds-orchestrator/pki
              readOnly: true
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              cpu: "4"
              memory: 8Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: data
          emptyDir: {}
        - name: config
          configMap:
            name: tese-runner-config
        - name: ca-publica
          configMap:
            name: tese-ca-publica
