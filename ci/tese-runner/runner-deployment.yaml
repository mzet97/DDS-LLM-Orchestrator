# Runner dedicado à tese (DRAFT — NÃO APLICAR sem aprovação + digest).
#
# Diferenças para o runner existente: label exclusiva `tese-rust:host`,
# capacidade 1, imagem própria com toolchain, CA pública montada somente
# leitura, sem hostPath/sem privileged/sem Docker socket. Token via Secret
# `tese-runner-secret` (a criar SOMENTE na ativação aprovada).
# Diff a apresentar: este arquivo inteiro (novo) + digest da imagem.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tese-runner
  namespace: ci-runners
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tese-runner
  namespace: ci-runners
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tese-runner
  template:
    metadata:
      labels:
        app: tese-runner
    spec:
      serviceAccountName: tese-runner
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1001
        runAsNonRoot: true
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: runner
          # Imagem APROVADA no aceite de 2026-09-13 (revisão 9321e31):
          # tese-runner:0.2.1 — build+deps completos (make/g++, toolchain
          # fixada, HOME/CARGO_HOME uid 1001, /etc/cyclonedds.xml com
          # CYCLONEDDS_URI). Aceite: bootstrap fail-closed OK; fmt/clippy
          # OK; SUÍTE COMPLETA --no-fail-fast 0 falhas; release build OK;
          # claim×5 estado novo OK (fix da arbitragem: strength do papel
          # propagada ao ToolCall.Request + requests publicadas como
          # CLIENT — ver commit 9321e31). Pull/execute por digest como
          # uid 1001 SEM apt-get/sudo/setpriv verificados.
          # Objetos OCI: índice sha256:cee130476b844294dc670b258bd3f6adbdbcb84d3d5762929bb52dc0a558917d
          # (docker-content-digest da tag 0.2.1) → manifest amd64
          # sha256:88261ef750ee47f181d5e1982af71faea83c93dc54e39e008a0eb4db726c5f61
          # → config sha256:0b000c11879ad343d1b64f29dde30728cf66fee3e6d6568111ba1f431de6a36d
          # + 10 camadas. Candidata anterior 0.2.0 (índice
          # sha256:33c1468b…) permanece no registry como diagnóstico
          # (deps de build incompletas; claim flaky pré-fix).
          # Pull: robot$tese+tese-ci (Pull+Push apenas no projeto tese).
          # Aplicado em 13/09 (piloto F1): referência por DIGEST via mirror
          # interno do k3s (registries.yaml -> HTTP do svc harbor-registry;
          # sem exigir CA no runtime do K3s) + imagePullSecrets com robot
          # pull-only (robot$tese+tese-pull). O digest é o MESMO índice OCI
          # publicado como tag 0.2.1 no Harbor.
          image: harbor.harbor.svc.cluster.local/tese/tese-runner@sha256:cee130476b844294dc670b258bd3f6adbdbcb84d3d5762929bb52dc0a558917d
          imagePullPolicy: IfNotPresent
          env:
            - name: GITEA_INSTANCE_URL
              # HTTPS validado: traefik (192.168.1.51:443) + cert local-ca;
              # CA montada via ConfigMap tese-ca-publica e aplicada ao
              # act_runner (SSL_CERT_FILE), git (GIT_SSL_CAINFO) e curl.
              value: https://gitea.home.arpa
            - name: GITEA_RUNNER_REGISTRATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: tese-runner-secret
                  key: token
            - name: GITEA_RUNNER_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: GITEA_RUNNER_LABELS
              value: "tese-rust:host"
            - name: CURL_CA_BUNDLE
              value: /etc/dds-orchestrator/pki/local-root-ca.crt
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /config.yaml
              subPath: config.yaml
            - name: ca-publica
              mountPath: /etc/dds-orchestrator/pki
              readOnly: true
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              cpu: "4"
              memory: 8Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: data
          emptyDir: {}
        - name: config
          configMap:
            name: tese-runner-config
        - name: ca-publica
          configMap:
            name: tese-ca-publica
