# Runner dedicado à tese (DRAFT — NÃO APLICAR sem aprovação + digest).
#
# Diferenças para o runner existente: label exclusiva `tese-rust:host`,
# capacidade 1, imagem própria com toolchain, CA pública montada somente
# leitura, sem hostPath/sem privileged/sem Docker socket. Token via Secret
# `tese-runner-secret` (a criar SOMENTE na ativação aprovada).
# Diff a apresentar: este arquivo inteiro (novo) + digest da imagem.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tese-runner
  namespace: ci-runners
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tese-runner
  namespace: ci-runners
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tese-runner
  template:
    metadata:
      labels:
        app: tese-runner
    spec:
      serviceAccountName: tese-runner
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1001
        runAsNonRoot: true
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: runner
          # Imagem publicada no Harbor (projeto `tese`, privado) em 2026-09-12.
          # Proveniência: candidata local tese-runner:0.2.0 (só local no .51),
          # ID sha256:33c1468bec5a8c5c6e0094ebb29ee7fff3ca6dc759c6d2c90416518a8149d5d1
          # — o digest do REGISTRY saiu IDÊNTICO ao ID local (conferidos no
          # push, no pull por digest e no header docker-content-digest).
          # Smoke uid 1001: rustc/cargo 1.95.0, rustfmt 1.9.0, clippy 0.1.95,
          # cmake 3.22.1, node v24.21.0, act_runner v0.2.12; /data gravável;
          # SEM docker.sock/kubeconfig/chaves SSH; entrypoint falha fechado
          # sem GITEA_* e registra somente com GITEA_* (pula com .runner).
          # Pull: robot$tese+tese-ci (Pull+Push apenas no projeto tese, 180d).
          image: harbor.home.arpa/tese/tese-runner@sha256:33c1468bec5a8c5c6e0094ebb29ee7fff3ca6dc759c6d2c90416518a8149d5d1
          imagePullPolicy: IfNotPresent
          env:
            - name: GITEA_INSTANCE_URL
              value: http://gitea-http.gitea.svc.cluster.local:3000
            - name: GITEA_RUNNER_REGISTRATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: tese-runner-secret
                  key: token
            - name: GITEA_RUNNER_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: GITEA_RUNNER_LABELS
              value: "tese-rust:host"
            - name: CURL_CA_BUNDLE
              value: /etc/dds-orchestrator/pki/local-root-ca.crt
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /config.yaml
              subPath: config.yaml
            - name: ca-publica
              mountPath: /etc/dds-orchestrator/pki
              readOnly: true
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              cpu: "4"
              memory: 8Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: data
          emptyDir: {}
        - name: config
          configMap:
            name: tese-runner-config
        - name: ca-publica
          configMap:
            name: tese-ca-publica
