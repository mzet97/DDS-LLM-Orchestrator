<!DOCTYPE html>
<html lang="pt-BR" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DDS-LLM Orchestrator - Painel de Controle</title>
<style>
:root{color-scheme:dark;--bg:#10151f;--panel:#171e2c;--line:#2b3648;--txt:#e9edf3;--mut:#9aa7ba;--acc:#4cc2ff;--ok:#3fb97f;--bad:#e05d5d}
[data-theme="light"]{color-scheme:light;--bg:#f2f4f7;--panel:#ffffff;--line:#d4dae2;--txt:#1c2431;--mut:#5d6b7f;--acc:#0369a1}
*{box-sizing:border-box}body{margin:0;font-family:ui-sans-system,system-ui,sans-serif;background:var(--bg);color:var(--txt)}
header{display:flex;align-items:center;gap:16px;padding:10px 18px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
header h1{font-size:16px;margin:0}header small{color:var(--mut)}
nav{display:flex;gap:4px}nav a{color:var(--mut);text-decoration:none;padding:7px 11px;border-radius:6px}nav a.active{color:var(--acc);background:rgba(76,194,255,.12)}
main{max-width:1080px;margin:0 auto;padding:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
button{background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:7px;padding:6px 12px;cursor:pointer}button:hover{border-color:var(--acc)}
input,select,textarea{background:var(--bg);color:var(--txt);border:1px solid var(--line);border-radius:7px;padding:7px 9px}
textarea{width:100%;min-height:100px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
pre{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;overflow:auto;max-height:340px;white-space:pre-wrap}
.mut{color:var(--mut);font-size:13px}.run{color:var(--ok)}.stop{color:var(--bad)}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.big{font-size:24px;font-weight:700}
#toasts{position:fixed;right:14px;bottom:14px;display:flex;flex-direction:column;gap:6px}.toast{background:var(--panel);border:1px solid var(--acc);border-radius:8px;padding:9px 13px}
footer{max-width:1080px;margin:0 auto;padding:10px 18px;color:var(--mut);font-size:12px}
</style>
<script>
const savedTheme = JSON.parse(localStorage.getItem('cp_user_config')||'{}').theme;
if(savedTheme) document.documentElement.dataset.theme = savedTheme;
function toast(m){const d=document.createElement('div');d.className='toast';d.textContent=m;document.getElementById('toasts').appendChild(d);setTimeout(()=>d.remove(),4000)}
async function api(method,path,body){const r=await fetch(path,{method,headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||('HTTP '+r.status));return d}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function fmtUp(s){if(s==null)return'–';s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?h+'h '+m+'m':(m?m+'m '+(s%60)+'s':s+'s')}
function toggleTheme(){const cur=document.documentElement.dataset.theme==='light'?'dark':'light';document.documentElement.dataset.theme=cur;const cfg=JSON.parse(localStorage.getItem('cp_user_config')||'{}');cfg.theme=cur;localStorage.setItem('cp_user_config',JSON.stringify(cfg));api('POST','/api/settings',{theme:cur}).catch(()=>{})}
</script>
</head>
<body>
<header>
  <div><h1>DDS-LLM Orchestrator</h1><small>Painel de Controle</small></div>
  <nav>
    <a href="/" data-nav="/">Dashboard</a><a href="/services" data-nav="/services">Serviços</a><a href="/tests" data-nav="/tests">Testes</a><a href="/chat" data-nav="/chat">Chat</a><a href="/vms" data-nav="/vms">Cluster</a><a href="/settings" data-nav="/settings">Config</a>
  </nav>
  <span style="flex:1"></span><span class="mut" id="op-status"></span>
  <button onclick="toggleTheme()" title="Alternar tema">Tema</button>
</header>
<script>document.querySelectorAll('[data-nav]').forEach(a=>{if(a.dataset.nav===location.pathname)a.classList.add('active')});function setBusy(b){document.getElementById('op-status').textContent=b?'operação em andamento…':'';document.title=(b?'● ':'')+'DDS-LLM Orchestrator - Painel de Controle'}</script>
<main>

<h2>Serviços</h2>
<div class="card">
  <div class="row"><label>Preset <select id="presetSel"></select></label><button id="applyPreset">Aplicar preset</button>
  <button id="stopAll">Parar todos</button></div>
  <div class="row"><label>Agentes <input id="agentCount" type="number" value="1" min="1" max="8" style="width:60px"></label>
  <label>Engine <select id="agentEngine"><option>mock</option><option>dds</option><option>http</option></select></label>
  <label>Slots <input id="agentSlots" type="number" value="1" min="1" max="16" style="width:60px"></label>
  <button id="startAgents">Iniciar agentes</button><button id="stopAgents">Parar agentes</button></div>
</div>
<div class="card"><table><thead><tr><th>Serviço</th><th>Categoria</th><th>Estado</th><th>PID</th><th>Uptime</th><th>Ações</th></tr></thead><tbody id="svc-body"></tbody></table></div>
<div class="card"><h3>Logs: <span id="logName" class="mut">—</span></h3>
<div class="row"><button id="refreshLogs">Atualizar</button><button id="exportLogs">Exportar .log</button><button id="clearLogs">Limpar</button><label><input type="checkbox" id="autoLogs" checked> auto-refresh</label></div>
<pre id="logs">selecione Logs em um serviço</pre></div>
<script>
let currentLog = null;
async function loadServices(){
  const [catalog,statuses,presets] = await Promise.all([api('GET','/catalog'),api('GET','/status'),api('GET','/presets')]);
  const sel = document.getElementById('presetSel'); if(!sel.options.length) sel.innerHTML = presets.map(p=>'<option value="'+esc(p.id)+'">'+esc(p.name)+'</option>').join('');
  const by = {}; statuses.forEach(s=>by[s.name]=s);
  document.getElementById('svc-body').innerHTML = catalog.map(s=>{const st=by[s.name];return '<tr><td><strong>'+esc(s.name)+'</strong><div class="mut">'+esc(s.description)+'</div></td><td>'+esc(s.category)+'</td><td>'+(st?'<span class="'+(st.running?'run':'stop')+'">'+esc(st.status)+'</span>':'<span class="mut">not_started</span>')+'</td><td>'+(st?.pid??'–')+'</td><td>'+fmtUp(st?.uptime_seconds)+'</td><td><button data-act="start" data-name="'+esc(s.name)+'">Start</button> <button data-act="stop" data-name="'+esc(s.name)+'">Stop</button> <button data-act="restart" data-name="'+esc(s.name)+'">Restart</button> <button data-act="logs" data-name="'+esc(s.name)+'">Logs</button></td></tr>'}).join('');
  document.querySelectorAll('[data-act]').forEach(b=>b.onclick=async()=>{const n=b.dataset.name;setBusy(true);try{
    if(b.dataset.act==='logs'){currentLog=n;document.getElementById('logName').textContent=n;await refreshLogs()}
    else{await api('POST','/services/'+n+'/'+b.dataset.act,{});toast(n+' '+b.dataset.act);await loadServices()}
  }catch(e){toast(e.message)}setBusy(false)});
}
async function refreshLogs(){ if(!currentLog) return; const d=await api('GET','/services/'+currentLog+'/logs?lines=200'); document.getElementById('logs').textContent=(d.lines||[]).join('\n')||'(sem logs)'; }
document.getElementById('refreshLogs').onclick = refreshLogs;
document.getElementById('clearLogs').onclick = async()=>{ if(currentLog){ await api('POST','/services/'+currentLog+'/clear-logs'); await refreshLogs(); }};
document.getElementById('exportLogs').onclick = ()=>{ if(!currentLog) return; const blob=new Blob([document.getElementById('logs').textContent],{type:'text/plain'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=currentLog+'.log'; a.click(); URL.revokeObjectURL(a.href); };
document.getElementById('applyPreset').onclick = async()=>{setBusy(true);try{await api('POST','/presets/'+document.getElementById('presetSel').value+'/apply');toast('preset aplicado')}catch(e){toast(e.message)}setBusy(false);loadServices()};
document.getElementById('stopAll').onclick = async()=>{await api('POST','/services/stop-all');toast('tudo parado');loadServices()};
document.getElementById('startAgents').onclick = async()=>{setBusy(true);try{await api('POST','/agents/start',{count:+document.getElementById('agentCount').value,engine:document.getElementById('agentEngine').value,slots:+document.getElementById('agentSlots').value});toast('agentes iniciados')}catch(e){toast(e.message)}setBusy(false);loadServices()};
document.getElementById('stopAgents').onclick = async()=>{await api('POST','/agents/stop-all');toast('agentes parados');loadServices()};
loadServices(); setInterval(()=>{ if(document.getElementById('autoLogs').checked) refreshLogs().catch(()=>{}); }, 3000);
</script>

</main>
<footer>v0.2.0 — DDS-LLM Orchestrator Control Panel (Rust)</footer>
<div id="toasts" role="status" aria-live="polite"></div>
</body>
</html>
