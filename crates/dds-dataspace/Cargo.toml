[package]
name = "dds-dataspace"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Camada DDS: readers/writers, WaitSet nativo, caches lock-free, zero-copy. Substitui dds_backend/."

[dependencies]
dds-contract = { version = "=0.1.0", path = "../dds-contract" }
orch-common = { version = "=0.1.0", path = "../orch-common" }
cyclonedds = { workspace = true, optional = true }
tokio = { workspace = true }
futures = { workspace = true }
futures-core = "0.3"
async-stream = "0.3"
async-trait = "0.1"
thiserror = { workspace = true }
dashmap = { workspace = true }
ahash = { workspace = true }
crossbeam-channel = { workspace = true }
parking_lot = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
cyclonedds-rust-sys = { workspace = true }

[features]
default = []
dds = ["dep:cyclonedds", "dds-contract/dds"]

[[bench]]
name = "write_loan"
harness = false
required-features = ["dds"]

[[bench]]
name = "cache_hasher"
harness = false
