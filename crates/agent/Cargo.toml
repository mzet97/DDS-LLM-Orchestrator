[package]
name = "agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Agente/proxy: assume tasks via DDS e faz ponte com o llama-server C++. 1º alvo da migração."

[dependencies]
dds-dataspace = { version = "=0.1.0", path = "../dds-dataspace" }
dds-contract = { version = "=0.1.0", path = "../dds-contract" }
orch-common = { version = "=0.1.0", path = "../orch-common" }
cyclonedds = { workspace = true, optional = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
async-stream = "0.3"
futures-core = "0.3"
futures-util = "0.3"
clap = { version = "4", features = ["derive"] }
hostname = "0.4"
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { workspace = true }
serde_json = { workspace = true }

[features]
default = []
dds = ["dep:cyclonedds", "dds-dataspace/dds", "dds-contract/dds"]

[[bin]]
name = "agent"
path = "src/main.rs"
