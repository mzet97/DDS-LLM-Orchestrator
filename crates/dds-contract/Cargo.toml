[package]
name = "dds-contract"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Tipos DDS gerados de OrchestratorDDS.idl (+ V4) via cyclonedds-build + perfis de QoS."

[dependencies]
cyclonedds = { workspace = true, optional = true }
serde = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
regex = "1"
tokio = { workspace = true }
futures = { workspace = true }

[build-dependencies]
cyclonedds-build = { version = "=3.0.0-alpha.3", git = "https://github.com/mzet97/cyclonedds-rust.git", rev = "7c1502f178ed7d777e1001f3dc1ae7e25da81abb" }
regex = "1"

[features]
default = []
# Liga geração IDL + runtime CycloneDDS (build C via cmake).
dds = ["dep:cyclonedds"]
security = ["dds", "cyclonedds/security"]
