[package]
name = "client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Cliente DDS: submete tasks e recebe resultados. Resolve o deadlock de 20 clientes do Python."

[dependencies]
dds-dataspace = { path = "../dds-dataspace" }
dds-contract = { path = "../dds-contract" }
orch-common = { path = "../orch-common" }
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
async-stream = "0.3"
futures-util = "0.3"
futures-core = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { version = "0.12", features = ["json"] }
uuid = { version = "1", features = ["v4"] }

[features]
default = []
dds = ["dds-dataspace/dds", "dds-contract/dds"]

[[bin]]
name = "e2e-bench"
path = "src/bin/e2e_bench.rs"
required-features = ["dds"]

[dev-dependencies]
agent = { path = "../agent", features = ["dds"] }
