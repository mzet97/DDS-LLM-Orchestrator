[package]
name = "studio-node"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "No local do DDS Orchestrator Studio: protocolo administrativo versionado e log idempotente de operacoes (fase 800, P2)."

[dependencies]
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
studio-core = { path = "../studio-core", version = "0.1" }
axum = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
sha2 = "0.10"
subtle = "2"
# T-890: presença DDS (`Studio.NodePresence`) — opcional; sem a feature `dds`
# o nó continua HTTP-only (o Studio descobre-o apenas via catálogo local).
cyclonedds = { workspace = true, optional = true }
dds-contract = { path = "../dds-contract", version = "=0.1.0", optional = true }
dds-dataspace = { path = "../dds-dataspace", version = "=0.1.0", optional = true }
futures = { workspace = true, optional = true }
# T-890-05: journal SQLite do log de operações (default; JsonStorage mantido
# para compat e migração).
rusqlite = { workspace = true }

[features]
dds = ["dep:dds-dataspace", "dep:dds-contract", "dep:cyclonedds", "dep:futures", "dds-dataspace/dds"]

[[bin]]
name = "studio-noded"
path = "src/main.rs"

[dev-dependencies]
serde_json = { workspace = true }
tower = { version = "0.5", features = ["util"] }

[lib]
name = "studio_node"
path = "src/lib.rs"

[lints]
workspace = true
