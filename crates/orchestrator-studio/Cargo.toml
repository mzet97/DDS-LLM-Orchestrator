[package]
name = "orchestrator-studio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Desktop nativo do DDS Orchestrator Studio (egui), fase 800."

[dependencies]
studio-core = { path = "../studio-core", version = "0.1" }
studio-node = { path = "../studio-node", version = "0.1" }
eframe = "0.36"
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
reqwest = { version = "0.12", features = ["blocking", "json"] }
dds-dataspace = { path = "../dds-dataspace", version = "=0.1.0", optional = true }
dds-contract = { path = "../dds-contract", version = "=0.1.0", features = ["dds"], optional = true }
futures = { workspace = true, optional = true }
tokio = { workspace = true }

[features]
default = []
dds = ["dep:dds-dataspace", "dep:dds-contract", "dep:futures", "dds-dataspace/dds"]

[dev-dependencies]
axum = { workspace = true }
serde_json = { workspace = true }

[[bin]]
name = "studio"
path = "src/main.rs"

[lib]
name = "orchestrator_studio"
path = "src/lib.rs"

[lints]
workspace = true
