# Workspace da migração para Rust do orquestrador DDS-LLM.
# Usa a crate `cyclonedds` publicada (crates.io, v2.0.0 — mesmo código de
# third_party/cyclonedds-rust) — mesmo wire format (XTypes/XCDR) do C++
# (llama_cpp) e do Python atual, permitindo migração incremental nos MESMOS
# tópicos DDS. Ver MIGRATION_PLAN.md.
[workspace]
resolver = "2"
members = [
    "crates/orch-common",
    "crates/qos-nfcm",
    "crates/dds-contract",
    "crates/dds-dataspace",
    "crates/llm-gateway",
    "crates/agent",
    "crates/orchestrator",
    "crates/client",
    "crates/spike-interop",
    "crates/context-store",
    "crates/policy-engine",
    "crates/mcp-gateway",
    "crates/observability",
    "crates/benchmarks",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
authors = ["Matheus Zeitune <matheus.zeitune.developer@gmail.com>"]
license = "MIT"

[workspace.dependencies]
cyclonedds = { path = "../../third_party/cyclonedds-rust/cyclonedds-rust/cyclonedds" }
cyclonedds-rust-sys = { path = "../../third_party/cyclonedds-rust/cyclonedds-rust/cyclonedds-rust-sys" }
# Runtime async multicore (Ryzen 5900X: 24 threads) e utilidades de perf.
tokio = { version = "1", features = ["full"] }
rayon = "1"                       # paralelismo data-parallel (treino/refresh)
futures = "0.3"
axum = "0.7"                      # ingestão HTTP (substitui aiohttp)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
parking_lot = "0.12"             # locks rápidos (substitui threading.Lock)
dashmap = "6"                    # caches concorrentes lock-free (substitui dicts+lock)
crossbeam-channel = "0.5"        # filas MPMC (substitui a fila de escrita única)
ahash = "0.8"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
opt-level = 3

[profile.bench]
lto = "thin"
