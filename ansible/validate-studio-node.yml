# Validação do studio-noded (F3 — DRAFT, não executar).
#
# Evidência 1 (daemon): hash == aprovado, protocolo 1.0, unidade ativa,
# DB preservado pelo esquema real via validate_db.py (sem campo inventado,
# backup com caminho explícito, negativos cobertos em
# ansible/tests/test_validate_db.py).
# Evidência 2 (DDS, domínio reservado obrigatório): FASE A smoke com
# engine mock (tarefa completa, SEM alegar agent_id/chunks/LLM.*) e FASE B
# caminho completo (det-responder + agent dds + submit-one) com correlação
# submissão→inferência→saída pelo contrato da revisão testada.
# Ciclo de vida por PID registrado + block/always (limpeza até em falha);
# sem pkill. Caminho de falha também testado.

- name: Exigir domínio de teste reservado + prompt verificável
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Recusar ausente, vazio ou protegido
      ansible.builtin.assert:
        that:
          - dds_test_domain is defined and dds_test_domain | string | length > 0
          - dds_test_domain | int != 0
          - dds_test_domain | int != 42
          - prompt_file is defined and prompt_file | length > 0
        fail_msg: "informe -e dds_test_domain=<reservado> -e prompt_file=<PROMPT_VERSION: canônico>; 0 e 42 (protegidos) são recusados"

    - name: Prompt confere com o hash canônico
      ansible.builtin.command:
        argv: ["sha256sum", "{{ prompt_file }}"]
      register: prompt_hash
      changed_when: false
      failed_when: prompt_hash.stdout.split()[0] not in lookup('file', playbook_dir + '/prompts.sha256')

- name: Validar daemon instalado
  hosts: studio_nodes
  vars:
    deploy_dir: /home/agent/dds-llm-rust
  tasks:
    - name: Hash instalado confere com o artefato aprovado
      ansible.builtin.command:
        argv: ["sha256sum", "{{ deploy_dir }}/studio-noded"]
      register: installed_hash
      changed_when: false
      failed_when: installed_hash.stdout.split()[0] != tese_approved_sha256

    - name: Protocolo anunciado 1.0
      ansible.builtin.uri:
        url: "http://{{ studio_node_bind }}:4317/version"
        return_content: true
      register: version
      failed_when: version.json.major != 1 or version.json.minor != 0

    - name: Unidade ativa
      ansible.builtin.systemd:
        name: studio-noded
      register: unit
      failed_when: unit.status.ActiveState != "active"
      become: true

    - name: DB preservado pelo esquema real (backup explícito)
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/validate_db.py"
          - "{{ deploy_dir }}/studio-node-log.json"
          - "{{ backup_path }}"
      register: dbcheck
      changed_when: false
      failed_when: "'ops_preservadas=' not in dbcheck.stdout"
      when: backup_path is defined and backup_path | length > 0

- name: DDS fase A — smoke com engine mock (escopo explícito)
  hosts: localhost
  connection: local
  vars:
    validation_dir: "{{ playbook_dir }}/../dist/validation"
    workdir: "{{ playbook_dir }}/../work/dds-validate-{{ dds_test_domain }}"
  tasks:
    - name: Diretório próprio do teste
      ansible.builtin.file:
        path: "{{ workdir }}"
        state: directory
        mode: '0755'

    - name: Fase A com limpeza garantida
      block:
        - name: Iniciar agent mock (PID registrado)
          ansible.builtin.shell:
            cmd: |
              "{{ validation_dir }}/agent" --agent-id validate-mock-{{ dds_test_domain }} \
                --dds-domain "{{ dds_test_domain }}" --engine mock --model qwen3.5-0.8b \
                > "{{ workdir }}/agent-mock.log" 2>&1 &
              echo $! > "{{ workdir }}/agent-mock.pid"
          environment:
            CYCLONEDDS_URI: '<CycloneDDS><Domain/></CycloneDDS>'
          changed_when: true

        - name: Submeter tarefa canônica
          ansible.builtin.shell:
            cmd: |
              set -euo pipefail
              MSG="$(python3 -c "import json;print(json.dumps([{'role':'system','content':open('{{ prompt_file }}').read()},{'role':'user','content':'valide'}]))")"
              "{{ validation_dir }}/submit-one" "{{ dds_test_domain }}" qwen3.5-0.8b "$MSG" --timeout-ms 60000
          environment:
            CYCLONEDDS_URI: '<CycloneDDS><Domain/></CycloneDDS>'
          register: submit
          changed_when: false

        - name: Smoke — tarefa completa (SEM alegar agent_id/chunks/LLM.*)
          ansible.builtin.command:
            argv:
              - python3
              - -c
              - >-
                import json,sys;
                r=json.load(sys.stdin);
                assert r['task_id'], 'sem identidade';
                assert r['success'] is True, 'sem conclusao';
                print('smoke task %s OK' % r['task_id'])
            stdin: "{{ submit.stdout }}"
          changed_when: false
      always:
        - name: Encerrar agent mock pelo PID
          ansible.builtin.command:
            argv: ["sh", "-c", "kill \"$(cat '{{ workdir }}/agent-mock.pid')\" 2>/dev/null || true"]
          changed_when: false

- name: DDS fase B — caminho completo com backend determinístico
  hosts: localhost
  connection: local
  vars:
    validation_dir: "{{ playbook_dir }}/../dist/validation"
    workdir: "{{ playbook_dir }}/../work/dds-validate-{{ dds_test_domain }}"
  tasks:
    - name: Fase B com limpeza garantida
      block:
        - name: Iniciar det-responder (PID registrado)
          ansible.builtin.shell:
            cmd: |
              "{{ validation_dir }}/det-responder" --domain "{{ dds_test_domain }}" \
                --delay-ms 5 --capacity 4 --log "{{ workdir }}/resp.jsonl" \
                > "{{ workdir }}/responder.log" 2>&1 &
              echo $! > "{{ workdir }}/responder.pid"
          environment:
            CYCLONEDDS_URI: '<CycloneDDS><Domain/></CycloneDDS>'
          changed_when: true

        - name: Iniciar agent dds (PID registrado)
          ansible.builtin.shell:
            cmd: |
              "{{ validation_dir }}/agent" --agent-id validate-dds-{{ dds_test_domain }} \
                --dds-domain "{{ dds_test_domain }}" --engine dds --model qwen3.5-0.8b \
                > "{{ workdir }}/agent-dds.log" 2>&1 &
              echo $! > "{{ workdir }}/agent-dds.pid"
          environment:
            CYCLONEDDS_URI: '<CycloneDDS><Domain/></CycloneDDS>'
          changed_when: true

        - name: Submeter e correlacionar submissão→inferência→saída
          ansible.builtin.shell:
            cmd: |
              set -euo pipefail
              MSG="$(python3 -c "import json;print(json.dumps([{'role':'system','content':open('{{ prompt_file }}').read()},{'role':'user','content':'valide'}]))")"
              "{{ validation_dir }}/submit-one" "{{ dds_test_domain }}" qwen3.5-0.8b "$MSG" --timeout-ms 120000 > "{{ workdir }}/submit.json"
              python3 -c "
              import json;
              r=json.load(open('{{ workdir }}/submit.json'));
              assert r['task_id'] and r['success'] is True, 'tarefa sem conclusao';
              resp=[json.loads(l) for l in open('{{ workdir }}/resp.jsonl')];
              assert any(r['task_id'] in json.dumps(e) for e in resp), 'inferencia sem correlacao com a tarefa';
              print('caminho completo task %s OK' % r['task_id'])"
          environment:
            CYCLONEDDS_URI: '<CycloneDDS><Domain/></CycloneDDS>'
          changed_when: false
      always:
        - name: Encerrar participantes pelos PIDs
          ansible.builtin.command:
            argv: ["sh", "-c", "kill \"$(cat '{{ workdir }}/{{ item }}')\" 2>/dev/null || true"]
          loop:
            - agent-dds.pid
            - responder.pid
          changed_when: false
